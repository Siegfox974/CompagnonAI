<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompagnonAI</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-ambiance="neon">
    <!-- Site en fond (app desktop uniquement) -->
    <section id="site-layer" hidden>
      <form id="site-bar">
        <button type="button" class="icon" id="site-back" title="Précédent">◀</button>
        <button type="button" class="icon" id="site-forward" title="Suivant">▶</button>
        <button type="button" class="icon" id="site-reload" title="Recharger">⟳</button>
        <input id="site-url" autocomplete="off" spellcheck="false" placeholder="Adresse du site…" />
        <button type="button" class="icon" id="cinema-toggle" title="Mode cinéma : n'afficher que la vidéo">🎬</button>
        <button type="button" class="icon" id="avatar-toggle" title="Afficher / masquer l'avatar">👁</button>
      </form>
      <div id="site-frame"></div>
    </section>

    <canvas id="scene"></canvas>

    <div id="drop-hint" class="hint">
      Glisse un fichier <b>.vrm</b> ici<br />
      <small>(ou une animation <b>.vmd</b>)</small>
      <small>ou place-le dans <code>models/default.vrm</code></small>
      <label class="btn">Choisir un fichier<input id="file" type="file" accept=".vrm" hidden /></label>
    </div>

    <aside id="panel">
      <header>
        <select id="char-select" title="Changer de personnage"></select>
        <span id="emotion" class="pill">neutral</span>
      </header>
      <nav class="toolbar">
        <button id="site-toggle" class="icon" title="Site en fond" hidden>🌐</button>
        <button id="act-toggle" class="icon" title="Moment intime : elle se caresse avec toi">🔥</button>
        <button id="motions-toggle" class="icon" title="Animations (.vmd)">🎞</button>
        <button id="react-toggle" class="icon" title="Réactions spontanées">💬</button>
        <button id="ambiance" class="icon" title="Ambiance">🎨</button>
        <button id="wardrobe-toggle" class="icon" title="Garde-robe">👗</button>
        <span class="spacer"></span>
        <button id="info-toggle" class="icon" title="Infos du modèle">ⓘ</button>
        <button id="reset" class="icon" title="Effacer la conversation">⟲</button>
      </nav>
      <div id="watching" class="watching" hidden></div>
      <div id="arousal" hidden><span>Excitation</span><div class="bar"><div id="arousal-fill"></div></div></div>
      <div id="vrm-info" hidden></div>
      <div id="motions" hidden>
        <div class="wardrobe-head">Animation du moment intime 🔥 <small>— glisse un .vmd pour en ajouter</small></div>
        <div id="motions-list"></div>
        <div class="motions-actions">
          <button type="button" class="btn small" id="motion-play">▶ Jouer en boucle</button>
          <button type="button" class="btn small ghost" id="motion-stop">■ Arrêter</button>
        </div>
      </div>
      <div id="wardrobe" hidden>
        <div class="wardrobe-head">Garde-robe <small>— décoche pour retirer</small></div>
        <div id="wardrobe-list"></div>
      </div>
      <div id="log"></div>
      <form id="input">
        <input id="message" autocomplete="off" placeholder="Écris-lui quelque chose…" />
        <button class="btn" type="submit">Envoyer</button>
      </form>
    </aside>

    <script type="module" src="/main.js"></script>
  </body>
</html>
